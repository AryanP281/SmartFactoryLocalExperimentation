
services:
  etcd:
    image: quay.io/coreos/etcd:v3.4.37
    ports:
      - "2381:2381"
      - "2380:2380"
    tmpfs:
      - /etcd-data:rw
    command:
      - /usr/local/bin/etcd
      - --name=node1 
      - --data-dir=/etcd-data 
      - --listen-client-urls=http://0.0.0.0:2381 
      - --advertise-client-urls=http://${ETCD_IP:-127.0.0.1}:2381 
      - --listen-peer-urls=http://0.0.0.0:2380 
      - --initial-advertise-peer-urls=http://${ETCD_IP:-127.0.0.1}:2380 
      - --initial-cluster=node1=http://${ETCD_IP:-127.0.0.1}:2380 
      - --initial-cluster-state=new

  zenohRouter:
    image:  eclipse/zenoh:1.7.2
    ports:
      - "7447:7447"
    command:
      - --listen 
      - tcp/0.0.0.0:7447
