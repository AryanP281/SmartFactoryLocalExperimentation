
services:
  dapr:
    image: daprio/daprd:1.17.1
    command:
      - "./daprd"
      - "-app-id"
      - ${APP_ID}
      - "-app-port"
      - "${APP_PORT}"
      - "--app-channel-address"
      - "app"
      - "-placement-host-address"
      - "${RUNTIME_IP}:50006"
      - "-resources-path"
      - "/dapr/components"
    volumes:
      - ${DAPR_VOL-/opt/dapr}:/dapr:ro
    extra_hosts:
      - "daprruntime:${RUNTIME_IP}"

  app:
    image: ${DAPR_APP_IMG:-daprApp}
    pull_policy: never
    environment:
      RUN_ID: ${COLLECTOR_RUN_ID:-0}
      DAPR_HTTP_ENDPOINT: http://dapr:3500
      DAPR_GRPC_ENDPOINT: http://dapr:50001
    command:  ["--server.port=${APP_PORT}"]
    ports:
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      - /vagrant/metrics:/collector/metrics:rw
    depends_on:
      - dapr